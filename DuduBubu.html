<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    body{
        background-color: rgb(245, 208, 220);
    }

    button{
        background-color: #ff6b81;
        color: white;
        border: none;
        padding: 12px 25px;
        margin: 10px;
        border-radius: 25px;
        font-size:18px ;
        cursor: pointer;
    }

    button:hover{
        transform: scale(1.1);
    }

    .message{
        color: #ff4f70;
        font-size: 50px;
        font-weight: bold;
        margin-top: 20px;
    }
   </style>
</head>
<body>
    <center>
    <img src="db-removebg-preview.png" alt="" width="300px">
    
    <h1>Do you love me?</h1>
    <button id="yes">Yes</button>
    <button id="no"
        onmouseover="move()"
        ontouchstart="move()">No</button>
        <p id="message"></p>
    </center>
    <script>
        
        function move() {
            let no =
            document.getElementById("no");
            no.style.position="fixed";
            no.style.left=Math.random() * 70 + "vw";
            no.style.top=Math.random() * 70 + "vh";
        }

        document.getElementById("yes").onclick=function() {
            document.getElementById("message").innerHTML="I knew it!🥰​❤️​";
        }

        
        
    </script>
    
</body>
</html>

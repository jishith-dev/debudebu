<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do you love me?</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background-color: rgb(245, 208, 220);

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;

            padding: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .image {
            width: min(300px, 70vw);
            height: auto;
            display: block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(28px, 7vw, 42px);
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            width: 100%;
        }

        button {
            background-color: #ff6b81;
            color: white;

            border: none;
            padding: 12px 25px;

            border-radius: 25px;

            font-size: clamp(16px, 4vw, 18px);

            cursor: pointer;

            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            transform: scale(1.1);
        }

        button:active {
            transform: scale(0.95);
        }

        .message {
            color: #ff4f70;

            font-size: clamp(30px, 9vw, 50px);

            font-weight: bold;

            margin-top: 25px;

            min-height: 60px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .image {
                width: min(280px, 75vw);
                margin-bottom: 15px;
            }

            h1 {
                margin-bottom: 15px;
            }

            .buttons {
                gap: 5px;
            }

            button {
                padding: 11px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            class="image"
            src="./db-removebg-preview.png"
            alt="Cute image"
        >

        <h1>Do you love me?</h1>

        <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>

        <p id="message" class="message"></p>

    </main>

    <script>
        const no = document.getElementById("no");
        const yes = document.getElementById("yes");
        const message = document.getElementById("message");

        function move() {
            no.style.position = "fixed";

            const maxX = window.innerWidth - no.offsetWidth - 10;
            const maxY = window.innerHeight - no.offsetHeight - 10;

            no.style.left = Math.max(10, Math.random() * maxX) + "px";
            no.style.top = Math.max(10, Math.random() * maxY) + "px";
        }

        no.addEventListener("mouseover", move);
        no.addEventListener("touchstart", function (event) {
            event.preventDefault();
            move();
        });

        yes.addEventListener("click", function () {
            message.textContent = "I knew it! 🥰❤️";
        });
    </script>

</body>
</html>
